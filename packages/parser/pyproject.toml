[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vip-parser"
version = "0.1.0"
description = "Xactimate PDF estimate parser"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.10.0",
    "pypdfium2>=4.30.0",
]

[tool.setuptools.packages.find]
include = ["vip_parser*"]
