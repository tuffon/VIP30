[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vip-shared"
version = "0.1.0"
description = "VIP30 shared business logic"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "openai>=1.12.0",
    "rapidfuzz>=3.9.7",
    "textstat==0.7.12",
    "pydantic>=2.10.0",
    "redis>=5.0.1",
    "lz4>=4.3.3",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.15.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "greenlet>=3.0.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.11.0",
    "resend>=2.21.0",
    "networkx>=3.2.0",
]

[tool.setuptools.packages.find]
include = ["vip_shared*"]
