services:
  - type: web
    name: vip30-web
    plan: starter
    env: python
    rootDir: apps/vip-parse
    buildCommand: |
      pip install -r requirements-web.txt
    startCommand: |
      gunicorn src.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT --timeout 120 --graceful-timeout 60
    envVars:
      - key: REDIS_URL
        fromService:
          name: vip30-redis
          type: redis
          property: connectionString

  - type: worker
    name: vip30-worker
    plan: starter
    env: python
    rootDir: apps/vip-parse
    autoDeploy: false
    buildCommand: |
      pip install -r requirements-worker.txt
    startCommand: |
      rq worker -u $REDIS_URL bidcomp --max-jobs 1
    envVars:
      - key: REDIS_URL
        fromService:
          name: vip30-redis
          type: redis
          property: connectionString
      - key: PARSE_CONCURRENCY
        value: "1"

  - type: redis
    name: vip30-redis
    plan: free
    ipAllowList: []

