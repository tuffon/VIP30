services:
  - type: web
    name: vip30-web
    plan: starter
    env: python
    rootDir: apps/vip-parse
    healthCheckPath: /render/debug/ping
    buildCommand: |
      pip install -r requirements-web.txt
    startCommand: |
      gunicorn src.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT --timeout 120 --graceful-timeout 60
    envVars:
      - key: REDIS_URL
        fromService:
          name: vip30-redis
          type: redis
          property: internalConnectionString

  - type: worker
    name: vip30-worker
    plan: starter
    env: python
    rootDir: apps/vip-parse
    autoDeploy: false
    buildCommand: |
      pip install -r requirements-worker.txt
    startCommand: |
      echo "Boot $(date)" && \
      python - << 'PY'
import os, sys, redis
url = os.environ.get('REDIS_URL')
if not url:
    print('REDIS_URL not set', file=sys.stderr)
    sys.exit(1)
safe = url.split('@')[-1] if '@' in url else url
print(f"Preflight Redis: {safe}")
r = redis.Redis.from_url(url, socket_connect_timeout=5, socket_timeout=5)
r.ping()
print("Redis OK")
PY
      \
      rq worker -u $REDIS_URL bidcomp
    envVars:
      - key: REDIS_URL
        fromService:
          name: vip30-redis
          type: redis
          property: internalConnectionString
      - key: PARSE_CONCURRENCY
        value: "1"

  - type: redis
    name: vip30-redis
    plan: free
    ipAllowList: []

